<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>
        ラッキー占い★
    </title>

    <style>
        .main-bg {
            width: 100%;
            height: 100vh;
            
            /* 万が一画像が読み込めなくても綺麗な「お祭り風の赤〜紫グラデーション」を背景にする設定 */
            background: linear-gradient(135deg, #d32f2f, #7b1fa2);
            
            background-image: url('https://images.unsplash.com/photo-1611604548018-d56bbd85d681?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            display: flex;
            justify-content: center;
            overflow: hidden;
        }
    </style>
</head>

<body> 
    <div class="main-bg">
        <div class="container w-75 bg-white bg-opacity-85 rounded shadow-lg py-4 mt-5" style="height: fit-content;">
            <h1 class="text-center text-danger mb-4">★今日の運勢は？？★</h1>
            
            <form id="form" class="mb-4">
                <div class="mb-3 col-10 col-md-6 mx-auto">
                    <input type="text" id="input" class="form-control text-center" placeholder="お名前を入力" autocomplete="off">
                </div>
                
                <div class="text-center">
                    <button type="submit" class="btn btn-danger btn-lg px-4 rounded-pill fw-bold shadow-sm">
                        ★PUSH★
                    </button>
                </div>
            </form>

            <ul id="ul" class="list-group col-10 col-md-6 mx-auto"></ul>

            <a id="share-btn" class="btn btn-dark w-100 mt-3 d-none" target="_blank" rel="noopener noreferrer">
                𝕏 で結果をシェアする
            </a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

    <script src="index.js"></script>

    <footer class="text-center py-4 text-muted border-top mt-5">
  <small>&copy; 2026 MyJavaScript Omikuji. All rights reserved.</small>
</footer>
</body>
</html>
